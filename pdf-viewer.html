<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地 PDF 阅读器</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/pdf-viewer.css"><script src="/pdf-viewer.js" type="module"></script></head><body><header class="pdf-toolbar"><div class="pdf-pages"><button id="prev" aria-label="上一页" disabled>‹</button><label>第 <input id="page" type="number" value="1" min="1" aria-label="PDF 页码"> / <span id="pages">—</span> 页</label><button id="next" aria-label="下一页" disabled>›</button></div><div class="pdf-tools"><button id="minus" aria-label="缩小">−</button><span id="scale">适宽</span><button id="plus" aria-label="放大">＋</button><button id="fit">适宽</button><a id="download" download>下载</a><a id="open" target="_blank" rel="noopener">原件 ↗</a></div></header><main id="stage" aria-busy="true"><p id="status" role="status">正在读取本地 PDF…</p><div id="paper"><canvas id="canvas" aria-label="PDF 页面图像"></canvas><div id="text-layer" class="textLayer"></div></div></main></body></html>
